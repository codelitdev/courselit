name: Publish Docker images

on:
  push:
    tags:
      - '*'

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  publish-docker-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Build the pushed tag itself.
      - name: checkout
        uses: actions/checkout@v4

      # The CodeLit Kubernetes nodes run on arm64; self-hosters may use amd64.
      # Installs and builds run natively (see the Dockerfiles); QEMU only runs
      # the arm64 runtime stages.
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERNAME }}
          password: ${{ secrets.DOCKERTOKEN }}

      - name: Docker meta for the app
        id: metaapp
        uses: docker/metadata-action@v5
        with:
          images: codelit/courselit-app
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Docker meta for the queue
        id: metaqueue
        uses: docker/metadata-action@v5
        with:
          images: codelit/courselit-queue
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push app
        id: docker_build_app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metaapp.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Image digest
        run: echo ${{ steps.docker_build_app.outputs.digest }}

      - name: Build and push queue
        id: docker_build_queue
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./services/queue/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metaqueue.outputs.tags }}
          cache-from: type=gha,scope=queue
          cache-to: type=gha,mode=max,scope=queue

      - name: Image digest
        run: echo ${{ steps.docker_build_queue.outputs.digest }}
